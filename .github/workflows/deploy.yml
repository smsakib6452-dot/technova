name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Create .env.local from secrets
        run: |
          echo "NEXT_PUBLIC_ADMIN_HASH=${{ secrets.NEXT_PUBLIC_ADMIN_HASH }}" > .env.local
          echo "NEXT_PUBLIC_DEMO_MODE=true" >> .env.local
        env:
          NEXT_PUBLIC_ADMIN_HASH: ${{ secrets.NEXT_PUBLIC_ADMIN_HASH }}
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Export static site
        run: npm run export
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Set this secret in the repository secrets (ADMIN_HASH).
      # The value should be the SHA-256 hex digest of your desired admin password.
      NEXT_PUBLIC_ADMIN_HASH: ${{ secrets.ADMIN_HASH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4