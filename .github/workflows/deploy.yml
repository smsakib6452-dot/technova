name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Create .env.local from secrets
        run: |
          echo "NEXT_PUBLIC_ADMIN_HASH=${{ secrets.NEXT_PUBLIC_ADMIN_HASH }}" > .env.local
          echo "NEXT_PUBLIC_DEMO_MODE=true" >> .env.local
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-pages-artifact@v2
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4